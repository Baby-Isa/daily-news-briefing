name: Verify feeds
 
on:
  workflow_dispatch:
 
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install the libraries the script needs
        run: pip install -r requirements.txt
 
      - name: Verify every feed
        run: python verify_feeds.py
 
