name: Build digest

on:
  schedule:
    # 05:10 UTC daily. Deliberately not on the hour: GitHub's scheduler is
    # busiest then and delays are common. Runs early because a scheduled
    # job can still slip by 10-30 minutes.
    - cron: "10 5 * * *"
  workflow_dispatch:

# Needed so the job can commit the digest back into the repository.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the libraries the script needs
        run: pip install -r requirements.txt

      - name: Build the digest
        run: python build_digest.py

      - name: Save the digest back to the repository
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add digest.txt
          # --allow-empty keeps a daily commit landing even on a quiet day,
          # which also keeps the scheduled workflow alive: GitHub disables
          # schedules on repositories with no activity for 60 days.
          git commit --allow-empty -m "Digest $(date -u +%Y-%m-%d)"
          git push
