name: Build digest

on:
  schedule:
    # GitHub delivers `schedule` events on a best-effort basis. They are
    # routinely delayed and are sometimes dropped altogether, worst around
    # round minutes when a large share of the platform tries to fire at once.
    # This repo has the receipts: with a single "10 5 * * *" trigger, the
    # 2 Aug run landed at 10:53 UTC (5h43m late) and the 3 Aug run never
    # arrived at all.
    #
    # So instead of one trigger we ask three times, at deliberately odd
    # minutes, spread across the early morning. Whichever attempt GitHub
    # actually delivers first does the work; the guard in the job below
    # turns the later ones into ~15-second no-ops. Times are UTC, so during
    # British Summer Time these are 05:37, 06:23 and 07:11 local.
    - cron: "37 4 * * *"
    - cron: "23 5 * * *"
    - cron: "11 6 * * *"
  # An external scheduler (cron-job.org, a Cloudflare Worker, anything that
  # can POST) pings this to work around GitHub dropping `schedule` events.
  # Such a ping must be idempotent: it fires every morning regardless of
  # whether one of the cron attempts above already landed, so by default it
  # falls through to the same "is today's digest already committed?" guard
  # the scheduled runs use, and no-ops in about fifteen seconds if so.
  # Pressing the button by hand with force=true rebuilds regardless.
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if today's digest is already committed"
        type: boolean
        default: false

# Needed so the job can commit the digest back into the repository.
permissions:
  contents: write

# If a later attempt starts while an earlier one is still building, queue it
# rather than letting both race to push a commit to main. By the time the
# queued run starts it will check out the finished digest and skip.
concurrency:
  group: build-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Decide whether today's digest still needs building
        id: decide
        run: |
          set -euo pipefail
          # A FORCED manual run always rebuilds: if you deliberately asked
          # for a fresh digest you want one, even if today's is committed.
          # An unforced dispatch - which is what the external scheduler
          # sends every morning - falls through to the date guard below, so
          # it costs nothing on days GitHub's own cron actually delivered.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.force }}" = "true" ]; then
            echo "Forced manual run - building regardless of what is committed."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # build_digest.py writes "NEWS DIGEST for Monday 03 August 2026"
          # into the header, so matching that tells us whether one of the
          # earlier scheduled attempts already succeeded today.
          today="$(date -u '+%A %d %B %Y')"
          # Read the header into a variable rather than piping into grep, so
          # that pipefail cannot trip over head being SIGPIPEd by an early
          # grep exit. A missing digest.txt yields an empty string and builds.
          header="$(head -5 digest.txt 2>/dev/null || true)"
          case "${header}" in
            *"NEWS DIGEST for ${today}"*)
              echo "Digest for ${today} is already committed - nothing to do."
              echo "build=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "No digest for ${today} yet - building."
              echo "build=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Set up Python
        if: steps.decide.outputs.build == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the libraries the script needs
        if: steps.decide.outputs.build == 'true'
        run: pip install -r requirements.txt

      - name: Build the digest
        if: steps.decide.outputs.build == 'true'
        run: python build_digest.py

      - name: Save the digest back to the repository
        if: steps.decide.outputs.build == 'true'
        run: |
          set -euo pipefail
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add digest.txt
          # --allow-empty keeps a daily commit landing even on a quiet day,
          # which also keeps the scheduled workflow alive: GitHub disables
          # schedules on repositories with no activity for 60 days.
          git commit --allow-empty -m "Digest $(date -u +%Y-%m-%d)"
          # Someone may have pushed to main while the feeds were being
          # fetched, which would otherwise reject this push.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
